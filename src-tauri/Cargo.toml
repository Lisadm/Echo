[package]
name = "echo"
version = "1.1.7"
description = "Echo"
authors = ["Sovern"]
edition = "2021"
license = "MIT"
default-run = "echo"

[profile.dev]
incremental = true # Compile your binary in smaller steps.
debug = "line-tables-only" # Full debuginfo bloats link time; backtraces still work.

# Dependencies are compiled once and cached — optimize them so debug-run audio
# paths (resampler, FFT, VAD) are usable; the workspace crate stays at opt 0.
[profile.dev.package."*"]
opt-level = 2

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "echo_lib"
# NOTE: `staticlib` removed for desktop. speakrs → ndarray-linalg → Intel MKL
# static pulls a huge archive that crashes rustc's ar_archive_writer (ICE at
# archive_writer.rs:818) when emitting the staticlib. Desktop only needs cdylib
# (GUI) + rlib (bin); staticlib is a mobile-only artifact. Restore it behind a
# mobile cfg if/when iOS/Android builds are added.
crate-type = ["cdylib", "rlib"]

# [[bin]]
# name = "cli"
# path = "src/audio_toolkit/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dependencies]
once_cell = "1"
tauri = { version = "2.10.2", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
rusqlite_migration = "2.3"
tauri-plugin-fs = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
cpal = "0.16.0"
anyhow = "1.0.95"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.25"
env_filter = "0.1.0"
tokio = "1.43.0"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git" }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
transcribe-rs = { version = "0.3.8", features = ["whisper-cpp", "onnx"] }
handy-keys = "0.2.4"
ferrous-opencc = "0.2.3"
clap = { version = "4", features = ["derive"] }
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.6"
speakrs = { version = "0.4.2", optional = true }
tiny_http = "0.12"
getrandom = "0.3"

[features]
default = ["diarization"]
diarization = ["dep:speakrs"]

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"
tauri-plugin-updater = "2.10.0"

[target.'cfg(windows)'.dependencies]
transcribe-rs = { version = "0.3.8", features = ["whisper-vulkan", "ort-directml"] }
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Console",
  "Media",
  "Media_Core",
  "Media_SpeechSynthesis",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
transcribe-rs = { version = "0.3.8", features = ["whisper-metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"
transcribe-rs = { version = "0.3.8", features = ["whisper-vulkan"] }

[patch.crates-io]
tauri-runtime = { git = "https://github.com/cjpais/tauri.git", branch = "handy-2.10.2" }
tauri-runtime-wry = { git = "https://github.com/cjpais/tauri.git", branch = "handy-2.10.2" }
tauri-utils = { git = "https://github.com/cjpais/tauri.git", branch = "handy-2.10.2" }
# Word-level timestamps fork: the published transcribe-rs 0.3.8 + a surgical patch that
# exposes whisper.cpp word/token timestamps (see feat/word-level-timestamps). Pinned to a
# rev so the build is reproducible; same pattern as the patched tauri fork above.
transcribe-rs = { git = "https://github.com/master5d/transcribe-rs", branch = "word-timestamps" }
# Diarization progress fork: published speakrs 0.4.2 + a progress-sink patch exposing
# per-stage diarization progress (see feat/diarization-progress). Pinned to the fork's
# progress branch; same pattern as the transcribe-rs fork above.
speakrs = { git = "https://github.com/master5d/speakrs", branch = "progress" }

[dev-dependencies]
tempfile = "3"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Daily release-grade builds: thin LTO + parallel codegen links minutes faster
# at ~equal runtime perf. Shipping artifacts keep using `release` (fat LTO).
# Usage: cargo build --profile fast (bare cargo only — tauri-cli bundling
# appends --release itself and expects target/release artifacts)
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
